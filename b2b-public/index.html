<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{if(localStorage.getItem("loudr_sidebar_collapsed")==="1")document.documentElement.classList.add("side-collapsed");}catch(e){}document.documentElement.classList.add("has-sidebar");})();</script>
<title>B2B Report — Loudr Media</title>
<link rel="icon" href="/walker/favicon.svg">
<link rel="manifest" href="/shared/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/shared/pwa.js" defer></script>
<link rel="stylesheet" href="/walker/style.css">
<link rel="stylesheet" href="/shared/sidebar.css">
<link rel="stylesheet" href="/shared/back-to-top.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <img src="/shared/logo-loudr.png" alt="Loudr Media" class="brandlogo">
    <div class="brandbar-right">
      <a href="https://docs.google.com/spreadsheets/d/1g00CRGRSYLECWMXltoLd75Ys2I8jSFYRii9S0-qK4fk/edit" target="_blank" rel="noopener" class="clear-btn preview-link">View in Spreadsheet</a>
      <button id="refresh-btn" class="refresh-btn" title="Refresh now" aria-label="Refresh now">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <span id="live-pill" class="live-pill">
        <span class="live-dot"></span>
        <span id="live-text">Live &ndash; checked just now</span>
      </span>
    </div>
  </div>

  <div class="topbar">
    <div>
      <p class="brand-eyebrow">B2B Sales Pipeline</p>
      <h1>B2B Report</h1>
      <p class="topbar-sub" id="report-title">&mdash;</p>
    </div>
    <div class="date-bar">
      <div class="select-wrap">
        <select id="quick-range"></select>
        <svg class="select-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="date-inputs">
        <input type="date" id="range-start">
        <span class="date-arrow">&rarr;</span>
        <input type="date" id="range-end">
      </div>
      <button id="range-clear" class="clear-btn">Clear</button>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar" hidden></div>
  <div class="kpi-row" id="b2b-kpis"></div>
  <div class="kpi-row" id="b2b-kpis-2"></div>

  <div class="panel">
    <div class="panel-head"><h2 class="panel-title">Ads</h2><span class="panel-sub" id="ads-sub"></span></div>
    <div class="table-scroll" id="b2b-ads"></div>
  </div>

  <div class="panel" id="leads-panel">
    <div class="panel-head">
      <h2 class="panel-title">Leads</h2>
      <div class="panel-head-right">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="lead-search" type="text" placeholder="Search name, firm, state, ad&hellip;">
        </div>
        <button class="expand-btn" id="leads-expand" type="button" title="Full screen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
      </div>
    </div>
    <p class="panel-sub" id="lead-count"></p>
    <div class="table-scroll">
      <table>
        <thead><tr><th id="lead-date-th">Date</th><th>Name</th><th>Firm</th><th>State</th><th>Contact Source</th><th>Ad</th><th>Stage</th><th>Status</th></tr></thead>
        <tbody id="lead-detail-body"></tbody>
      </table>
    </div>
    <div id="leads-empty" class="empty-msg" hidden>No leads in this range.</div>
  </div>

</div>

<div id="video-panel" class="video-panel" aria-hidden="true">
  <div class="video-panel-head">
    <div class="video-panel-titlewrap">
      <span id="video-panel-title" class="video-panel-title">Preview</span>
      <span id="video-panel-sub" class="video-panel-views"></span>
    </div>
    <button id="video-panel-close" class="video-panel-close" aria-label="Close preview">&times;</button>
  </div>
  <div id="video-panel-embed" class="video-panel-embed"></div>
  <div id="video-panel-body" class="video-panel-body"></div>
</div>
<script src="app.js"></script>
<script src="/shared/sidebar.js" data-active="b2b"></script>
<script src="/shared/back-to-top.js"></script>
</body>
</html>
